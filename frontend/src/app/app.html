<!-- =========================================
     CONTENIDO PRINCIPAL
========================================= -->

<main class="contenido">

  <router-outlet></router-outlet>

</main>


<!-- =========================================
     MICRÓFONO GLOBAL
========================================= -->

@if (accesibilidad.navegacionVoz()) {

<div
  class="voz-global"
  [class.escuchando]="voz.escuchando()">


  @if (voz.escuchando()) {

  <div
    class="mensaje-voz"
    aria-live="polite">

    <strong>
      Escuchando...
    </strong>

    <span>
          Di un comando
        </span>

  </div>

  }


  <button
    type="button"
    class="microfono-global"
    [class.activo]="voz.escuchando()"
    (click)="
        voz.escuchando()
          ? voz.detenerEscucha()
          : voz.iniciarEscucha()
      "
    [attr.aria-label]="
        voz.escuchando()
          ? 'Detener reconocimiento de voz'
          : 'Activar reconocimiento de voz'
      "
    [attr.aria-pressed]="voz.escuchando()">


    @if (voz.escuchando()) {

    <!-- DETENER -->

    <svg
      width="22"
      height="22"
      viewBox="0 0 24 24"
      fill="currentColor"
      aria-hidden="true">

      <rect
        x="6"
        y="6"
        width="12"
        height="12"
        rx="2">
      </rect>

    </svg>

    } @else {

    <!-- MICRÓFONO -->

    <svg
      width="25"
      height="25"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true">

      <rect
        x="9"
        y="2"
        width="6"
        height="12"
        rx="3">
      </rect>

      <path
        d="M5 10a7 7 0 0 0 14 0">
      </path>

      <path
        d="M12 17v5">
      </path>

      <path
        d="M8 22h8">
      </path>

    </svg>

    }


  </button>

</div>

}
